/* =========================================================
   Room normalization
========================================================= */

function normalizeRoom(st){

  if(!st)return st;

  st.players=st.players||[];
  st.hands=st.hands||{};
  st.field=st.field||null;
  st.passedIds=st.passedIds||[];
  st.finished=st.finished||[];
  st.log=st.log||[];

  st.rules=Object.assign(
    defaultRules(),
    st.rules||{}
  );

  st.revolutionActive=!!st.revolutionActive;
  st.elevenBackActive=!!st.elevenBackActive;

  st.direction=st.direction||1;

  st.suitLockValue=
    st.suitLockValue||
    null;

  st.stairsLockActive=
    !!st.stairsLockActive;

  st.suitStreak={
    suit:
      st.suitStreak&&st.suitStreak.suit||
      null,
    count:
      st.suitStreak&&st.suitStreak.count||
      0
  };

  st.stairsStreak=
    st.stairsStreak||0;

  /*
    旧データに残っていても、
    ♦3を強制的に出させない
  */
  st.mustLeadDiamond3=false;

  st.pendingAction=
    st.pendingAction||
    null;

  st.ended=!!st.ended;

  return st;
}

/* =========================================================
   Firebase helpers
========================================================= */

function getShared(key){

  if(!window.fbdb){
    return Promise.reject(
      new Error("firebase-not-ready")
    );
  }

  return window.fbdb
    .ref(key)
    .once("value")
    .then(snap=>
      snap.exists()
        ? normalizeRoom(snap.val())
        : null
    );
}

function setShared(key,obj){

  if(!window.fbdb){
    return Promise.reject(
      new Error("firebase-not-ready")
    );
  }

  return window.fbdb
    .ref(key)
    .set(obj);
}

function watchShared(key,cb){

  if(!window.fbdb){
    return ()=>{};
  }

  const ref=window.fbdb.ref(key);

  const handler=snap=>{
    cb(
      snap.exists()
        ? normalizeRoom(snap.val())
        : null
    );
  };

  const errHandler=err=>{
    showToast("通信エラー："+err.message);
  };

  ref.on(
    "value",
    handler,
    errHandler
  );

  return ()=>{
    ref.off("value",handler);
  };
}

/* =========================================================

========================================================= */

function escapeHtml(s){
  return String(s).replace(
    /[&<>"']/g,
    m=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[m])
  );
}

function randomId(){
  return Math.random()
    .toString(36)
    .slice(2,10)+
    Date.now().toString(36);
}

function randomRoomCode(){
  const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s="";
  for(let i=0;i<5;i++){
    s+=chars[
      Math.floor(
        Math.random()*chars.length
      )
    ];
  }
  return s;
}

function showToast(msg){

  clearTimeout(toastTimer);

  toastTimer=setTimeout(()=>{

  render();
}

function roomPath(code){

/* =========================================================
   Deck
========================================================= */

function freshDeck(rules){

  const deck=[];

  for(const suit of SUITS){
    for(const rank of RANKS){
      deck.push(
        makeCard(rank,suit.id)
      );
    }
  }

  if(rules.joker){
    deck.push("X-1");
    deck.push("X-2");
  }

  return deck;
}

function shuffle(arr){

  const a=arr.slice();

  for(let i=a.length-1;i>0;i--){

    const j=
      Math.floor(
        Math.random()*(i+1)
      );

    [a[i],a[j]]=
      [a[j],a[i]];
  }

  return a;
}

/* =========================================================
   Players / logs
========================================================= */

function activePlayers(st){

  const finishedIds=
    new Set(
      st.finished.map(f=>f.id)
    );

  return st.players.filter(
    p=>!finishedIds.has(p.id)
  );
}

  const finishedIds=
    new Set(
      st.finished.map(f=>f.id)
    );

  const dir=st.direction||1;
  const n=st.players.length;

  for(let i=1;i<=n;i++){

    const cand=
      st.players[
        ((idx+dir*i)%n+n)%n
      ];

    if(
      cand &&
      !finishedIds.has(cand.id)
    ){
      return cand.id;
    }
  }

  return fromId;
}

function pushLog(st,text){

  st.log=st.log||[];

  st.log.push(text);

  if(st.log.length>8){
    st.log=
      st.log.slice(-8);
  }
}

function nameOf(st,id){

  const p=
    st.players.find(
      p=>p.id===id
    );

  return p?p.name:"???";
}

/* =========================================================
   Card helpers
========================================================= */

function normalCards(cards){
  return cards.filter(
    c=>!isJoker(c)
  );
}

function getNormalRanks(cards){

  return normalCards(cards)
    .map(cardRank);
}

function monoSuit(cards){

  const normals=
    normalCards(cards);

  if(normals.length===0){
    return null;
  }

  const suit=
    cardSuit(normals[0]);

  if(
    normals.every(
      c=>cardSuit(c)===suit
    )
  ){
    return suit;
  }

  return null;
}

/*
  ジョーカー入り階段を判定。

  例：
  5♠ 6♠ JOKER 8♠
  → 5,6,7,8 として有効

  10♠ JOKER Q♠
  → 10,J,Q として有効
*/

function getRunCandidates(cards){

  if(cards.length<3){
    return [];
  }

  const normals=
    normalCards(cards);

  const jokers=
    cards.filter(isJoker);

  if(normals.length===0){
    return [];
  }

  const suit=monoSuit(cards);

  if(!suit){
    return [];
  }

  const ranks=
    normals.map(cardRank)
      .sort((a,b)=>a-b);

  /*
    同じ数字の通常カードが2枚以上ある場合、
    階段にはできない
  */
  const unique=
    new Set(ranks);

  if(unique.size!==ranks.length){
    return [];
  }

  const n=cards.length;
  const candidates=[];

  /*
    3～15の範囲で、
    n枚の連番の「最高値」を総当たり
  */
  for(
    let top=3+n-1;
    top<=15;
    top++
  ){

    const start=top-n+1;

    let valid=true;

    for(const r of ranks){

      if(
        r<start||
        r>top
      ){
        valid=false;
        break;
      }
    }

    if(!valid)continue;

    const missing=[];

    for(let r=start;r<=top;r++){

      if(!unique.has(r)){
        missing.push(r);
      }
    }

    if(missing.length===jokers.length){
      candidates.push({
        suit,
        start,
        top,
        missing
      });
    }
  }

  return candidates;
}

function isRun(cards){
  return getRunCandidates(cards).length>0;
}

/*
  階段でどの数字として扱うか決定。

  通常の階段なら唯一の候補。
  複数候補がある場合は、
  場を超えるものを優先し、
  それ以外では一番低いもの。
*/

function chooseRunRank(st,cards){

  const candidates=
    getRunCandidates(cards);

  if(candidates.length===0){
    return null;
  }

  if(!st.field){
    return candidates[0].top;
  }

  const valid=
    candidates
      .filter(c=>
        effectiveRank(
          st,
          c.top
        )>
        effectiveRank(
          st,
          st.field.rank
        )
      )
      .sort(
        (a,b)=>a.top-b.top
      );

  if(valid.length){
    return valid[0].top;
  }

  return candidates[0].top;
}

/* =========================================================
   Selection classification
========================================================= */

function classifySelection(st,cards){

  if(!cards.length){
    return null;
  }

  const rules=st.rules||defaultRules();

  const jokers=
    cards.filter(isJoker);

  const normals=
    cards.filter(c=>!isJoker(c));

  /*
    ジョーカーなし
  */
  if(jokers.length===0){

    const ranks=
      cards.map(cardRank);

    const same=
      ranks.every(
        r=>r===ranks[0]
      );

    if(same){
      return {
        kind:"same",
        rank:ranks[0],
        count:cards.length,
        suit:monoSuit(cards),
        special:false
      };
    }

    if(
      rules.stairs &&
      isRun(cards)
    ){

      const top=
        chooseRunRank(
          st,
          cards
        );

      return {
        kind:"run",
        rank:top,
        count:cards.length,
        suit:monoSuit(cards),
        special:false
      };
    }

    return null;
  }

  /*
    ジョーカーあり
  */
  if(rules.joker){

    /*
      全部ジョーカー
    */
    if(normals.length===0){

      return {
        kind:"same",
        rank:16,
        count:cards.length,
        suit:null,
        special:false
      };
    }

    /*
      通常カードが全部同じ数字
      → 同数組としてジョーカーをワイルド扱い
    */
    const ranks=
      normals.map(cardRank);

    const sameRank=
      ranks.every(
        r=>r===ranks[0]
      );

    if(sameRank){

      return {
        kind:"same",
        rank:ranks[0],
        count:cards.length,
        suit:monoSuit(cards),
        special:false
      };
    }

    /*
      階段
    */
    if(
      rules.stairs &&
      isRun(cards)
    ){

      const top=
        chooseRunRank(
          st,
          cards
        );

      return {
        kind:"run",
        rank:top,
        count:cards.length,
        suit:monoSuit(cards),
        special:false
      };
    }
  }

  return null;
}

/* =========================================================
   Strength
========================================================= */

function effectiveRank(st,rank){

  const rules=
    st.rules||defaultRules();

  const flips=
    (st.revolutionActive?1:0)+
    (st.elevenBackActive?1:0);

  if(flips%2===0){
    return rank;
  }

  const maxRank=
    rules.joker?16:15;

  return (
    3+maxRank
  )-rank;
}

/* =========================================================
   Field clear
========================================================= */

function clearField(st){

  st.field=null;
  st.passedIds=[];
  st.elevenBackActive=false;

  /*
    場が流れたら一時的な縛りを全部解除
  */
  st.suitLockValue=null;
  st.stairsLockActive=false;

  st.suitStreak={
    suit:null,
    count:0
  };

  st.stairsStreak=0;
}

/* =========================================================
   Finish
========================================================= */

function addFinish(st,id){

  if(
    st.finished.some(
      f=>f.id===id
    )
  ){
    return;
  }

  st.finished.push({
    id,
    name:nameOf(st,id),
    rank:st.finished.length+1
  });
}

function tryFinishGame(st){

  const remaining=
    activePlayers(st);

  if(remaining.length<=1){

    if(remaining.length===1){
      addFinish(
        st,
        remaining[0].id
      );
    }

    st.ended=true;
    st.turnPlayerId=null;

    pushLog(
      st,
      "ゲーム終了！"
    );
  }
}

/* =========================================================
   Validation
========================================================= */

function isValidSelection(st,cards){

  const rules=
    st.rules||defaultRules();

  if(!cards.length){
    return {
      ok:false,
      reason:"カードを選んでください"
    };
  }

  /*
    ♦3スタートでも、
    ♦3を強制的に出すことはない
  */

  /*
    スペ3返し
  */
  if(
    rules.spade3Return &&
    st.field &&
    st.field.kind==="same" &&
    st.field.rank===16 &&
    cards.length===1 &&
    cards[0]==="S-3"
  ){
    return {
      ok:true,
      info:{
        kind:"same",
        rank:3,
        count:1,
        suit:"S",
        special:"spade3Return"
      }
    };
  }

  const info=
    classifySelection(
      st,
      cards
    );

  if(!info){
    return {
      ok:false,
      reason:"そのカードの組み合わせは出せません"
    };
  }

  /*
    階段縛り
  */
  if(
    st.stairsLockActive &&
    info.kind!=="run"
  ){
    return {
      ok:false,
      reason:"階段縛り中は階段で出してください"
    };
  }

  /*
    マーク縛り
  */
  if(
    st.suitLockValue
  ){

    const suit=
      monoSuit(cards);

    /*
      全ジョーカーは現在の縛りマークとして
      ワイルド扱い
    */
    if(
      suit!==st.suitLockValue &&
      !(cards.every(isJoker))
    ){
      return {
        ok:false,
        reason:
          "マーク縛り中です（"+
          (suitInfo(st.suitLockValue)?.sym||"")+
          "）"
      };
    }
  }

  /*
    同マーク下出し
  */
  if(
    st.field &&
    rules.sameSuitLower &&
    info.kind==="same" &&
    st.field.kind==="same" &&
    info.suit &&
    info.suit===st.field.suit
  ){

    /*
      同マークなら弱くてもOK
    */
    if(
      cards.length===
      st.field.count
    ){
      return {
        ok:true,
        info
      };
    }
  }

  /*
    場がある場合
  */
  if(st.field){

    if(
      cards.length!==st.field.count
    ){
      return {
        ok:false,
        reason:
          "場と同じ枚数で出してください"
      };
    }

    if(
      info.kind!==st.field.kind
    ){
      return {
        ok:false,
        reason:
          "場と同じ種類の出し方にしてください"
      };
    }

    /*
      階段はresolved top rankで比較
    */
    if(
      effectiveRank(
        st,
        info.rank
      )<=
      effectiveRank(
        st,
        st.field.rank
      )
    ){
      return {
        ok:false,
        reason:"場より強いカードを出してください"
      };
    }
  }

  return {
    ok:true,
    info
  };
}

/* =========================================================
   Play application
========================================================= */

function applyPlay(
  st,
  myId,
  cards,
  selInfo
){

  const rules=
    st.rules||defaultRules();

  const hand=
    st.hands[myId]||[];

  const removeSet=
    new Set(cards);

  st.hands[myId]=
    hand.filter(
      c=>!removeSet.has(c)
    );

  const kind=selInfo.kind;
  const rank=selInfo.rank;
  const count=cards.length;

  const isEight=
    !!rules.eightCut &&
    kind==="same" &&
    rank===8 &&
    !selInfo.special;

  const is99Car=
    !!rules.ninetyNineCar &&
    kind==="same" &&
    count===2 &&
    cards.every(
      c=>
        !isJoker(c)&&
        cardRank(c)===9
    );

  const isQueenBomber=
    !!rules.queenBomber &&
    kind==="same" &&
    rank===12 &&
    count===4;

  const isRevolution=
    (
      !!rules.revolution &&
      kind==="same" &&
      count===4 &&
      !cards.some(isJoker)
    )||
    (
      !!rules.stairsRevolution &&
      kind==="run" &&
      count>=4
    );

  const isFiveSkip=
    !!rules.fiveSkip &&
    kind==="same" &&
    rank===5;

  const isNineReverse=
    !!rules.nineReverse &&
    kind==="same" &&
    rank===9;

  const isElevenBack=
    !!rules.elevenBack &&
    kind==="same" &&
    rank===11;

  const isSevenGive=
    !!rules.sevenGive &&
    kind==="same" &&
    rank===7;

  const isTenDiscard=
    !!rules.tenDiscard &&
    kind==="same" &&
    rank===10;

  /*
    場の情報を作る
  */
  st.field={
    cards:cards.slice(),
    rank,
    count,
    kind,
    suit:selInfo.suit||monoSuit(cards)||null,
    byId:myId
  };

  st.passedIds=[];

  pushLog(
    st,
    nameOf(st,myId)+
    "："+cards.map(cardText).join(" ")+" を出した"
  );

  /*
    マーク縛りの進行
    場が続いている間だけ有効
  */
  if(
    rules.suitLock &&
    selInfo.suit
  ){

    if(
      st.suitStreak.suit===
      selInfo.suit
    ){
      st.suitStreak.count++;
    }else{
      st.suitStreak={
        suit:selInfo.suit,
        count:1
      };
    }

    if(
      st.suitStreak.count>=2
    ){
      st.suitLockValue=
        selInfo.suit;

      pushLog(
        st,
        "マーク縛り発生！"
      );
    }
  }else if(
    rules.suitLock
  ){
    /*
      マークを持たない特殊出しなら
      連続条件をリセット
    */
    st.suitStreak={
      suit:null,
      count:0
    };
  }

  /*
    階段縛り
  */
  if(
    rules.stairsLock
  ){

    if(kind==="run"){
      st.stairsStreak++;
    }else{
      st.stairsStreak=0;
    }

    if(
      st.stairsStreak>=2
    ){
      st.stairsLockActive=true;

      pushLog(
        st,
        "階段縛り発生！"
      );
    }
  }

  /*
    11バック
  */
  if(isElevenBack){

    st.elevenBackActive=
      !st.elevenBackActive;

    pushLog(
      st,
      st.elevenBackActive
        ? "イレブンバック！"
        : "強さが元に戻った！"
    );
  }

  /*
    革命
  */
  if(isRevolution){

    st.revolutionActive=
      !st.revolutionActive;

    pushLog(
      st,
      st.revolutionActive
        ? "革命！"
        : "革命返し！"
    );
  }

  /*
    9リバース
  */
  if(isNineReverse){

    st.direction=
      (st.direction||1)*-1;

    pushLog(
      st,
      "9リバース！"
    );
  }

  /*
    8切り / 99車
  */
  if(isEight||is99Car){

    if(is99Car){
      pushLog(
        st,
        "99車！場が流れます"
      );
    }else{
      pushLog(
        st,
        "8切り！場が流れます"
      );
    }

    clearField(st);

    /*
      出した本人が再びリード
    */
    if(
      st.hands[myId] &&
      st.hands[myId].length>0
    ){
      st.turnPlayerId=myId;
    }else{
      addFinish(st,myId);
      tryFinishGame(st);

      if(!st.ended){
        st.turnPlayerId=
          nextActiveId(
            st,
            myId
          );
      }
    }

    return;
  }

  /*
    クイーンボンバー
    → ここではまだ爆破しない
  */
  if(isQueenBomber){

    pushLog(
      st,
      "クイーンボンバー！対象のカードを選んでください"
    );

    st.pendingAction={
      type:"queenBomber",
      byId:myId
    };

    /*
      Q4で手札が0枚でも、
      ボンバー処理が終わるまで順位確定しない
    */
    st.turnPlayerId=myId;

    return;
  }

  /*
    5スキップ
  */
  let nextId=
    nextActiveId(
      st,
      myId
    );

  if(isFiveSkip){

    const skipped=
      nextId;

    pushLog(
      st,
      nameOf(st,skipped)+
      "を5スキップ！"
    );

    nextId=
      nextActiveId(
        st,
        skipped
      );
  }

  /*
    7渡し
    ターゲットは必ず直後のプレイヤー。
    5スキップと組み合わせても、
    「渡す相手」は5スキップ前の人。
  */
  let giveTargetId=
    nextActiveId(
      st,
      myId
    );

  /*
    10捨て / 7渡し
  */
  if(
    isSevenGive||
    isTenDiscard
  ){

    const remaining=
      st.hands[myId]||[];

    const countToChoose=
      Math.min(
        isSevenGive
          ? count
          : 1,
        remaining.length
      );

    if(countToChoose>0){

      st.pendingAction={
        type:
          isSevenGive
            ? "sevenGive"
            : "tenDiscard",

        byId:myId,

        count:countToChoose,

        targetId:
          isSevenGive
            ? giveTargetId
            : null,

        nextTurnId:
          nextId
      };

      return;
    }

    /*
      手札がない場合はそのまま続行
    */
  }

  /*
    通常の上がり
  */
  if(
    st.hands[myId] &&
    st.hands[myId].length===0
  ){

    addFinish(
      st,
      myId
    );

    pushLog(
      st,
      nameOf(st,myId)+
      " が上がり！"
    );
  }

  tryFinishGame(st);

  if(st.ended){
    return;
  }

  st.turnPlayerId=
    nextId;
}

/* =========================================================
   Pending actions
========================================================= */

function resolvePendingAction(
  st,
  myId,
  chosenCards,
  bombRank
){

  const pa=st.pendingAction;

  if(!pa){
    throw new Error(
      "処理待ちのアクションがありません"
    );
  }

  if(pa.byId!==myId){
    throw new Error(
      "この操作をするプレイヤーではありません"
    );
  }

  /*
    7渡し
  */
  if(pa.type==="sevenGive"){

    const hand=
      st.hands[myId]||[];

    const targetId=
      pa.targetId;

    if(!targetId){
      throw new Error(
        "渡す相手が見つかりません"
      );
    }

    if(
      chosenCards.length!==pa.count
    ){
      throw new Error(
        "渡すカードを"+
        pa.count+
        "枚選んでください"
      );
    }

    if(
      !chosenCards.every(
        c=>hand.includes(c)
      )
    ){
      throw new Error(
        "選択したカードが手札にありません"
      );
    }

    const chosenSet=
      new Set(chosenCards);

    st.hands[myId]=
      hand.filter(
        c=>!chosenSet.has(c)
      );

    st.hands[targetId]=
      st.hands[targetId]||[];

    st.hands[targetId].push(
      ...chosenCards
    );

    pushLog(
      st,
      nameOf(st,myId)+
      " → "+
      nameOf(st,targetId)+
      " に "+
      chosenCards.map(cardText).join(" ")+
      " を渡した"
    );

    st.pendingAction=null;

    if(
      st.hands[myId].length===0
    ){

      addFinish(st,myId);

      pushLog(
        st,
        nameOf(st,myId)+
        " が上がり！"
      );
    }

    tryFinishGame(st);

    if(!st.ended){

      let next=
        pa.nextTurnId;

      if(
        !activePlayers(st)
          .some(p=>p.id===next)
      ){
        next=
          nextActiveId(
            st,
            myId
          );
      }

      st.turnPlayerId=next;
    }

    return;
  }

  /*
    10捨て
  */
  if(pa.type==="tenDiscard"){

    const hand=
      st.hands[myId]||[];

    if(chosenCards.length!==1){
      throw new Error(
        "捨てるカードを1枚選んでください"
      );
    }

    const c=chosenCards[0];

    if(!hand.includes(c)){
      throw new Error(
        "そのカードは手札にありません"
      );
    }

    st.hands[myId]=
      hand.filter(
        x=>x!==c
      );

    pushLog(
      st,
      nameOf(st,myId)+
      " は10捨てで "+
      cardText(c)+
      " を捨てた"
    );

    st.pendingAction=null;

    if(
      st.hands[myId].length===0
    ){

      addFinish(st,myId);

      pushLog(
        st,
        nameOf(st,myId)+
        " が上がり！"
      );
    }

    tryFinishGame(st);

    if(!st.ended){

      let next=
        pa.nextTurnId;

      if(
        !activePlayers(st)
          .some(p=>p.id===next)
      ){
        next=
          nextActiveId(
            st,
            myId
          );
      }

      st.turnPlayerId=next;
    }

    return;
  }

  /*
    クイーンボンバー
  */
  if(pa.type==="queenBomber"){

    if(
      bombRank===null||
      bombRank===undefined
    ){
      throw new Error(
        "爆破するカードを選んでください"
      );
    }

    let total=0;

    const targetText=
      bombRank==="joker"
        ? "JOKER"
        : rankLabel(bombRank);

    /*
      全プレイヤーの手札から対象を除去
    */
    for(const p of st.players){

      const hand=
        st.hands[p.id]||[];

      let removed=0;

      const newHand=
        hand.filter(c=>{

          const match=
            bombRank==="joker"
              ? isJoker(c)
              : (
                !isJoker(c)&&
                cardRank(c)===bombRank
              );

          if(match){
            removed++;
            total++;
            return false;
          }

          return true;
        });

      st.hands[p.id]=newHand;

      if(removed>0){

        pushLog(
          st,
          nameOf(st,p.id)+
          " の "+
          targetText+
          " を "+
          removed+
          "枚爆破"
        );
      }
    }

    if(total===0){

      pushLog(
        st,
        "対象カードを持っている人はいませんでした"
      );
    }else{

      pushLog(
        st,
        "クイーンボンバー："+targetText+
        " を合計 "+
        total+
        "枚爆破！"
      );
    }

    /*
      Q4を出した本人が0枚なら
      まず1位にする。

      同時に0枚になった他プレイヤーも
      プレイヤー順に順位を付ける。
    */
    const finishedBefore=
      new Set(
        st.finished.map(f=>f.id)
      );

    for(const p of st.players){

      if(
        finishedBefore.has(p.id)
      ){
        continue;
      }

      if(
        (st.hands[p.id]||[]).length===0
      ){
        addFinish(
          st,
          p.id
        );

        pushLog(
          st,
          nameOf(p?st:p.id,p.id)+
          " が上がり！"
        );
      }
    }

    /*
      上のnameOf呼び出しを安全にする
    */
    for(const f of st.finished){
      const player=st.players.find(
        p=>p.id===f.id
      );
      if(player){
        f.name=player.name;
      }
    }

    clearField(st);

    st.pendingAction=null;

    tryFinishGame(st);

    if(!st.ended){

      /*
        ボンバーを使った本人が残っていれば
        場が流れたので本人がリード。
      */
      if(
        activePlayers(st)
          .some(p=>p.id===myId)
      ){
        st.turnPlayerId=myId;
      }else{
        st.turnPlayerId=
          nextActiveId(
            st,
            myId
          );
      }
    }

    return;
  }

  throw new Error(
    "不明な処理待ちアクションです"
  );
}

/* =========================================================
   Pass
========================================================= */

function applyPass(st,myId){

  if(st.pendingAction){
    throw new Error(
      "現在は特殊処理中です"
    );
  }

  if(
    st.turnPlayerId!==myId
  ){
    throw new Error(
      "あなたの番ではありません"
    );
  }

  if(!st.field){
    throw new Error(
      "場が空のときはパスできません"
    );
  }

  if(
    st.field.byId===myId &&
    st.passedIds.length===0
  ){
    /*
      場を出した直後の本人は
      通常のゲームではパス不要だが、
      再びターンが来た場合は場があるので
      パス可能とする。
    */
  }

  if(
    !st.passedIds.includes(myId)
  ){
    st.passedIds.push(myId);
  }

  pushLog(
    st,
    nameOf(st,myId)+"：パス"
  );

  const actives=
    activePlayers(st);

  const everyoneElsePassed=
    actives
      .filter(
        p=>p.id!==st.field.byId
      )
      .every(
        p=>st.passedIds.includes(p.id)
      );

  if(everyoneElsePassed){

    const leader=
      st.field.byId;

    pushLog(
      st,
      "全員パス。場が流れます"
    );

    clearField(st);

    if(
      st.hands[leader] &&
      st.hands[leader].length>0
    ){
      st.turnPlayerId=leader;
    }else{

      addFinish(
        st,
        leader
      );

      tryFinishGame(st);

      if(!st.ended){
        st.turnPlayerId=
          nextActiveId(
            st,
            leader
          );
      }
    }

    return;
  }

  st.turnPlayerId=
    nextActiveId(
      st,
      myId
    );
}

/* =========================================================
   Card display
========================================================= */

function cardText(c){

  if(isJoker(c)){
    return "JOKER";
  }

  const suit=
    suitInfo(cardSuit(c));

  return (
    (suit?suit.sym:"")+
    rankLabel(cardRank(c))
  );
}

function cardElement(
  c,
  opts={}
){

  const small=
    !!opts.small;

  const tiny=
    !!opts.tiny;

  const clickable=
    !!opts.clickable;

  const isSelected=
    !!opts.selected;

  let cls="card";

  if(small)cls+=" small";
  if(tiny)cls+=" tiny";
  if(isSelected)cls+=" selected";

  if(isJoker(c)){
    cls+=" joker";
  }else{
    const suit=
      suitInfo(cardSuit(c));

    if(suit&&suit.red){
      cls+=" red";
    }
  }

  const suit=
    isJoker(c)
      ? "★"
      : suitInfo(cardSuit(c))?.sym||"";

  const rank=
    isJoker(c)
      ? "JOKER"
      : rankLabel(cardRank(c));

  const div=
    document.createElement("div");

  div.className=cls;

  div.innerHTML=
    '<div class="rank">'+
    escapeHtml(rank)+
    '</div>'+
    '<div class="suit">'+
    escapeHtml(suit)+
    '</div>';

  if(clickable){
    div.addEventListener(
      "click",
      ()=>{
        opts.onClick(c);
      }
    );
  }

  return div;
}

async function createRoom(){

  if(!nameInput.trim()){
    showToast("名前を入力してください");

  }

  busy=true;
  render();

  try{

    let code=null;
    let existing=null;

    for(let i=0;i<10;i++){

      const c=
        randomRoomCode();

      const r=
        await getShared(
          roomPath(c)
        );

      if(!r){
        code=c;
        break;
      }
    }

    if(!code){
      throw new Error(
        "部屋番号を作成できませんでした"
      );
    }

    me.id=randomId();
    me.name=nameInput.trim();

    const st={
      code,
      hostId:me.id,

      players:[
        {
          id:me.id,
          name:me.name
        }
      ],

      hands:{},

      field:null,

      passedIds:[],
      finished:[],
      log:[
        me.name+" が部屋を作成しました"
      ],

      rules:defaultRules(),

      started:false,
      ended:false,

      turnPlayerId:null,

      revolutionActive:false,
      elevenBackActive:false,

      },

    };

/* =========================================================
   Watch room
========================================================= */

let unwatch=null;

function watchRoom(){

  if(unwatch){
    unwatch();
    unwatch=null;
  }

  if(!currentRoomCode){
    return;
  }

  unwatch=
    watchShared(
      roomPath(currentRoomCode),
      st=>{

        if(!st){

          room=null;
          screen="home";
          render();
          return;
        }

        room=st;

        const exists=
          room.players.some(
            p=>p.id===me.id
          );

        if(!exists){

          showToast(
            "部屋から退出しました"
          );

          currentRoomCode=null;
          screen="home";

        }else if(room.ended){

          screen="result";

        }else if(room.started){

          screen="game";

        }else{

          if(
            screen!=="rules" &&
            screen!=="editname"
          ){
            screen="lobby";
          }
        }

        render();
      }
    );
}

/* =========================================================
   Start game
========================================================= */

async function startGame(){

  if(busy)return;

  if(!room)return;

  if(room.hostId!==me.id){
    showToast(
      "ホストだけが開始できます"
    );
    return;
  }

  if(
    room.players.length<2
  ){
    showToast(
      "2人以上必要です"
    );
    return;
  }

  busy=true;
  render();

  try{

    const st=
      await getShared(
        roomPath(currentRoomCode)
      );

    if(!st){
      throw new Error(
        "部屋が見つかりません"
      );
    }

    const rules=
      Object.assign(
        defaultRules(),
        st.rules||{}
      );

    const deck=
      shuffle(
        freshDeck(rules)
      );

    st.hands={};

    st.players.forEach(
      p=>{
        st.hands[p.id]=[];
      }
    );

    for(
      let i=0;
      i<deck.length;
      i++
    ){

      const p=
        st.players[
          i%st.players.length
        ];

      st.hands[p.id].push(
        deck[i]
      );
    }

    /*
      手札を見やすくソート
    */
    for(const p of st.players){

      st.hands[p.id].sort(
        cardSort
      );
    }

    let starter=
      st.players[0].id;

    /*
      ♦3を持つ人から開始するだけ。
      ♦3を出す義務はない。
    */
    if(rules.diamond3Start){

      const owner=
        st.players.find(
          p=>
            (st.hands[p.id]||[])
              .includes("D-3")
        );

      if(owner){
        starter=owner.id;
      }
    }

    st.field=null;
    st.passedIds=[];
    st.finished=[];
    st.log=[];

    st.started=true;
    st.ended=false;

    st.turnPlayerId=starter;

    st.revolutionActive=false;
    st.elevenBackActive=false;

    st.direction=1;

    st.suitLockValue=null;

    st.stairsLockActive=false;

    st.suitStreak={
      suit:null,
      count:0
    };

    st.stairsStreak=0;

    st.mustLeadDiamond3=false;

    st.pendingAction=null;

    pushLog(
      st,
      "ゲーム開始！"
    );

    pushLog(
      st,
      nameOf(st,starter)+
      "さんからスタート"
    );

    if(rules.diamond3Start){
      pushLog(
        st,
        "♦3スタート：♦3を出す必要はありません"
      );
    }

    await setShared(
      roomPath(currentRoomCode),
      st
    );

    room=st;

    selected.clear();

  }catch(e){

    showToast(
      "開始失敗："+e.message
    );

  }finally{

    busy=false;
    render();
  }
}

/* =========================================================
   Play
========================================================= */

async function doPlay(){

  if(busy||!room)return;

  if(
    room.turnPlayerId!==me.id
  ){
    showToast(
      "あなたの番ではありません"
    );
    return;
  }

  if(room.pendingAction){
    showToast(
      "特殊処理を先に完了してください"
    );
    return;
  }

  const cards=
    Array.from(selected);

  busy=true;
  render();

  try{

    const st=
      await getShared(
        roomPath(currentRoomCode)
      );

    if(!st){
      throw new Error(
        "部屋が見つかりません"
      );
    }

    if(
      st.turnPlayerId!==me.id
    ){
      throw new Error(
        "他のプレイヤーが先に操作しました"
      );
    }

    const hand=
      st.hands[me.id]||[];

    if(
      !cards.every(
        c=>hand.includes(c)
      )
    ){
      throw new Error(
        "選択したカードが手札にありません"
      );
    }

    const validation=
      isValidSelection(
        st,
        cards
      );

    if(!validation.ok){
      throw new Error(
        validation.reason
      );
    }

    applyPlay(
      st,
      me.id,
      cards,
      validation.info
    );

    await setShared(
      roomPath(currentRoomCode),
      st
    );

    selected.clear();
    pendingSelected.clear();
    pendingBombRank=null;

  }catch(e){

    showToast(
      e.message
    );

  }finally{

    busy=false;
    render();
  }
}

/* =========================================================
   Pass
========================================================= */

async function doPass(){

  if(busy||!room)return;

  busy=true;
  render();

}

/* =========================================================
   Resolve pending
========================================================= */

async function doResolvePendingAction(){

  if(busy||!room)return;

  const pa=
    room.pendingAction;

  if(!pa)return;

  if(pa.byId!==me.id){
    return;
  }

  let chosen=[];

  if(
    pa.type==="sevenGive"||
    pa.type==="tenDiscard"
  ){

    chosen=
      Array.from(pendingSelected);

    if(
      chosen.length!==pa.count
    ){
      showToast(
        pa.type==="sevenGive"
          ? "渡すカードを"+pa.count+"枚選んでください"
          : "捨てるカードを1枚選んでください"
      );
      return;
    }
  }

  if(
    pa.type==="queenBomber" &&
    pendingBombRank===null
  ){
    showToast(
      "爆破するカードを選んでください"
    );
    return;
  }

  busy=true;
  render();

  try{

    const st=
      await getShared(
        roomPath(currentRoomCode)
      );

    if(!st){
      throw new Error(
        "部屋が見つかりません"
      );
    }

    resolvePendingAction(
      st,
      me.id,
      chosen,
      pendingBombRank
    );

    await setShared(
      roomPath(currentRoomCode),
      st
    );

    pendingSelected.clear();
    pendingBombRank=null;

  }catch(e){

    showToast(
      e.message
    );

  }finally{

    busy=false;
    render();
  }
}

  try{

    await setShared(
      roomPath(currentRoomCode),
      room
    );

    screen="lobby";
    render();

  }catch(e){

    showToast(
      "ルール保存失敗："+e.message
    );
  }
}

/* =========================================================
   Sort
========================================================= */

function cardSort(a,b){

  const ja=isJoker(a);
  const jb=isJoker(b);

  if(ja&&!jb)return 1;
  if(!ja&&jb)return -1;

  if(ja&&jb){
    return cardRank(a)-cardRank(b);
  }

  const ra=cardRank(a);
  const rb=cardRank(b);

  if(ra!==rb){
    return ra-rb;
  }

  const order={
    S:0,
    H:1,
    D:2,
    C:3
  };

  return (
    (order[cardSuit(a)]??9)-
    (order[cardSuit(b)]??9)
  );
}

        「階段革命」をONにすると階段も自動的にONになります。
      </div>

      <div class="rule-list">

        ${RULE_DEFS.map(def=>`

          <label
            class="rule-item"
            for="rule-${def.key}"
          >

            <input
              id="rule-${def.key}"
              type="checkbox"
              ${
                room.rules[def.key]
                  ? "checked"
                  : ""
              }
            >

            <div>
              <div class="rule-name">
                ${escapeHtml(def.name)}
              </div>

              <div class="rule-desc">
                ${escapeHtml(def.desc)}
              </div>
            </div>

          </label>

        `).join("")}

      </div>

      <button
        class="btn"
        id="saveRulesBtn"
      >
        保存
      </button>

      <button
        class="btn-outline"
        id="cancelRulesBtn"
      >
        戻る
      </button>

    </div>
  `;
}

/* =========================================================
   Edit name
========================================================= */

function renderEditName(){

    <div class="title" style="font-size:25px;">

    </div>

    <div class="panel">

      <button

/* =========================================================
   Game
========================================================= */

function renderGame(){

  if(!room){
    return renderHome();
  }

  const myTurn=
    room.turnPlayerId===me.id;

  const myHand=
    room.hands[me.id]||[];

  const pa=
    room.pendingAction;

  const field=
    room.field;

  let turnText="";

  if(room.ended){
    turnText="ゲーム終了";
  }else if(pa){

    if(pa.byId===me.id){
      turnText="特殊アクションを処理してください";
    }else{
      turnText=
        nameOf(room,pa.byId)+
        "さんの特殊アクション中";
    }

  }else if(myTurn){

    turnText="あなたの番";

  }else{

    turnText=
      nameOf(
        room,
        room.turnPlayerId
      )+
      "さんの番";
  }

  return `
    <div class="topbar">

      <div class="topbar-title">
        大富豪
      </div>

      <div class="topbar-info">
        ${escapeHtml(room.code)}<br>
        ${room.revolutionActive?"革命中":""}
        ${
          room.elevenBackActive
            ? " / イレブンバック"
            : ""
        }
      </div>

    </div>

    <div class="game-table">

      <div class="turn-banner">
        ${escapeHtml(turnText)}
      </div>

      <div class="player-around">

        ${room.players.map(p=>{

          const finished=
            room.finished.some(
              f=>f.id===p.id
            );

          const active=
            room.turnPlayerId===p.id;

          const count=
            (room.hands[p.id]||[]).length;

          return `
            <div class="
              player-mini
              ${active?"active":""}
              ${finished?"finished":""}
            ">

              <div class="mini-name">
                ${escapeHtml(p.name)}
                ${
                  p.id===me.id
                    ? "（自分）"
                    : ""
                }
              </div>

              <div class="mini-count">
                ${
                  finished
                    ? "上がり"
                    : count+"枚"
                }
              </div>

            </div>
          `;

        }).join("")}

      </div>

      <div class="field-area">

        ${
          field
            ? `
              <div class="field-label">
                ${field.kind==="run"?"階段":"場"}
                ${
                  room.suitLockValue
                    ? " / マーク縛り"
                    : ""
                }
                ${
                  room.stairsLockActive
                    ? " / 階段縛り"
                    : ""
                }
              </div>

              <div class="field-cards">

                ${field.cards.map(c=>
                  cardElement(
                    c,
                    {
                      small:true
                    }
                  ).outerHTML
                ).join("")}

              </div>

              <div class="muted">
                ${escapeHtml(
                  nameOf(room,field.byId)
                )}さん
              </div>
            `
            : `
              <div class="field-label">
                場は空です
              </div>

              <div class="muted">
                ${room.rules.diamond3Start &&
                  !room.finished.length &&
                  !room.field
                  ? "♦3スタート"
                  : "好きな組み合わせを出せます"}
              </div>
            `
        }

      </div>

      <div class="log-box">

        <div class="log-title">
          行動ログ
        </div>

        ${
          room.log&&room.log.length
            ? room.log.map(
                x=>`
                  <div class="log-line">
                    ${escapeHtml(x)}
                  </div>
                `
              ).join("")
            : `
              <div class="log-line">
                まだありません
              </div>
            `
        }

      </div>

    </div>

    ${
      pa
        ? renderPendingActionArea(pa)
        : `
          <div class="hand-panel">

            <div class="hand-title">
              <span>
                あなたの手札
              </span>

              <span class="muted">
                ${myHand.length}枚
              </span>
            </div>

            <div
              class="hand"
              id="myHand"
            ></div>

            <div class="action-area">

              <div class="action-buttons">

                <button
                  class="btn"
                  id="playBtn"
                  ${
                    !myTurn||
                    busy||
                    selected.size===0
                      ? "disabled"
                      : ""
                  }
                >
                  出す
                </button>

                <button
                  class="btn-outline"
                  id="passBtn"
                  ${
                    !myTurn||
                    busy||
                    !room.field
                      ? "disabled"
                      : ""
                  }
                >
                  パス
                </button>

              </div>

            </div>

          </div>
        `
    }

    <div class="footer-space"></div>
  `;
}

/* =========================================================
   Pending action area
========================================================= */

function renderPendingActionArea(pa){

  const mine=
    pa.byId===me.id;

  /*
    クイーンボンバー
  */
  if(pa.type==="queenBomber"){

    return `
      <div class="panel action-area">

        <div class="action-info">

          <strong>
            クイーンボンバー！
          </strong>

          <br>

          ${
            mine
              ? "爆破するカードを1種類選んでください"
              : escapeHtml(
                  nameOf(room,pa.byId)
                )+
                "さんが爆破するカードを選択中です"
          }

        </div>

        ${
          mine
            ? `
              <div class="pending-card-buttons">

                ${RANKS.map(r=>`

                  <button
                    class="bomb-choice ${
                      pendingBombRank===r
                        ? "selected"
                        : ""
                    }"
                    data-bomb-rank="${r}"
                  >
                    ${escapeHtml(
                      rankLabel(r)
                    )}
                  </button>

                `).join("")}

                ${
                  room.rules.joker
                    ? `
                      <button
                        class="bomb-choice ${
                          pendingBombRank==="joker"
                            ? "selected"
                            : ""
                        }"
                        data-bomb-rank="joker"
                      >
                        JOKER
                      </button>
                    `
                    : ""
                }

              </div>

              <button
                class="btn"
                id="resolvePendingBtn"
                ${busy?"disabled":""}
              >
                このカードを爆破する
              </button>
            `
            : `
              <div class="notice center">
                選択が終わるまで待ってください
              </div>
            `
        }

      </div>
    `;
  }

  /*
    7渡し
  */
  if(pa.type==="sevenGive"){

    const target=
      nameOf(
        room,
        pa.targetId
      );

    return `
      <div class="panel action-area">

        <div class="action-info">

          <strong>7渡し</strong>

          <br>

          ${
            mine
              ? escapeHtml(target)+
                "さんに、好きなカードを"+
                pa.count+
                "枚選んで渡してください"
              : escapeHtml(
                  nameOf(room,pa.byId)
                )+
                "さんが7渡しを処理中です"
          }

        </div>

        ${
          mine
            ? `
              <div
                class="hand"
                id="pendingHand"
              ></div>

              <button
                class="btn"
                id="resolvePendingBtn"
                ${
                  pendingSelected.size!==pa.count||
                  busy
                    ? "disabled"
                    : ""
                }
              >
                ${pa.count}枚渡す
              </button>
            `
            : `
              <div class="notice center">
                処理が終わるまで待ってください
              </div>
            `
        }

      </div>
    `;
  }

  /*
    10捨て
  */
  if(pa.type==="tenDiscard"){

    return `
      <div class="panel action-area">

        <div class="action-info">

          <strong>10捨て</strong>

          <br>

          ${
            mine
              ? "捨てるカードを1枚選んでください"
              : escapeHtml(
                  nameOf(room,pa.byId)
                )+
                "さんが10捨てを処理中です"
          }

        </div>

        ${
          mine
            ? `
              <div
                class="hand"
                id="pendingHand"
              ></div>

              <button
                class="btn"
                id="resolvePendingBtn"
                ${
                  pendingSelected.size!==1||
                  busy
                    ? "disabled"
                    : ""
                }
              >
                1枚捨てる
              </button>
            `
            : `
              <div class="notice center">
                処理が終わるまで待ってください
              </div>
            `
        }

      </div>
    `;
  }

  return "";
}

/* =========================================================
   Result
========================================================= */

function renderResult(){

  if(!room){
    return renderHome();
  }

  const results=
    room.finished||[];

  return `
    <div class="title">
      GAME RESULT
    </div>

    <div class="panel">

      <h2 class="center">
        結果
      </h2>

      ${
        results.map(f=>`

          <div class="result-rank">

            <div class="result-number">
              ${f.rank}
            </div>

            <div>
              <strong>
                ${escapeHtml(f.name)}
              </strong>
            </div>

          </div>

        `).join("")
      }

      ${
        results.length===0
          ? `
            <div class="muted center">
              結果がありません
            </div>
          `
          : ""
      }

    </div>

    <div class="panel">

      <h2>行動ログ</h2>

      ${
        room.log.map(
          x=>`
            <div class="log-line">
              ${escapeHtml(x)}
            </div>
          `
        ).join("")
      }

    </div>

    <button
      class="btn"
      id="backLobbyBtn"
    >
      待機ルームへ
    </button>

    <button
      class="btn-outline"
      id="homeBtn"
    >
      ホームへ
    </button>

    <div class="footer-space"></div>
  `;
}

/* =========================================================
   Render
========================================================= */

function render(){

  const app=
    document.getElementById("app");

  if(!app)return;

  let html="";

  if(screen==="loading"){

    html=`
      <div class="loading">
        <div>
          <div class="title">
            大富豪オンライン
          </div>
          <div>
            読み込み中...
          </div>
        </div>
      </div>
    `;

  }else if(screen==="home"){

    html=renderHome();

  }else if(screen==="lobby"){

    html=renderLobby();

  }else if(screen==="rules"){

    html=renderRules();

  }else if(screen==="editname"){

    html=renderEditName();

  }else if(screen==="game"){

    html=renderGame();

  }else if(screen==="result"){

    html=renderResult();

  }else{

    html=renderHome();
  }

  if(toastMsg){

    html+=`
      <div class="toast">
        ${escapeHtml(toastMsg)}
      </div>
    `;
  }

  app.innerHTML=html;

  bindEvents();

  /*
    ゲーム画面の手札をDOMで作る
  */
  if(screen==="game"){

    renderHand();

    if(room&&room.pendingAction){
      renderPendingHand();
    }
  }
}

/* =========================================================
   Hand rendering
========================================================= */

function renderHand(){

  const el=
    document.getElementById(
      "myHand"
    );

  if(!el||!room)return;

  const hand=
    (room.hands[me.id]||[])
      .slice()
      .sort(cardSort);

  el.innerHTML="";

  for(const c of hand){

    const card=
      cardElement(
        c,
        {
          clickable:true,
          selected:selected.has(c),
          onClick:toggleCard
        }
      );

    el.appendChild(card);
  }
}

function renderPendingHand(){

  const el=
    document.getElementById(
      "pendingHand"
    );

  if(!el||!room)return;

  const hand=
    (room.hands[me.id]||[])
      .slice()
      .sort(cardSort);

  el.innerHTML="";

  for(const c of hand){

    const card=
      cardElement(
        c,
        {
          clickable:true,
          selected:
            pendingSelected.has(c),
          onClick:togglePendingCard
        }
      );

    el.appendChild(card);
  }
}

/* =========================================================
   Selection
========================================================= */

function toggleCard(c){

  if(!room)return;

  if(
    room.turnPlayerId!==me.id||
    room.pendingAction
  ){
    return;
  }

  if(selected.has(c)){
    selected.delete(c);
  }else{
    selected.add(c);
  }

  render();
}

function togglePendingCard(c){

  if(!room)return;

  const pa=
    room.pendingAction;

  if(!pa||pa.byId!==me.id){
    return;
  }

  const max=
    pa.type==="sevenGive"
      ? pa.count
      : 1;

  if(pendingSelected.has(c)){

    pendingSelected.delete(c);

  }else{

    if(
      pendingSelected.size>=max
    ){
      showToast(
        "選択できる枚数は"+max+"枚です"
      );
      return;
    }

    pendingSelected.add(c);
  }

  render();
}

/* =========================================================
   Events
========================================================= */

function bindEvents(){

  /*
    Home
  */

  const nameEl=
    document.getElementById(
      "nameInput"
    );

  if(nameEl){

    nameEl.addEventListener(
      "input",
      e=>{
        nameInput=e.target.value;
      }
    );
  }

  const joinEl=
    document.getElementById(
      "joinCode"
    );

  if(joinEl){

    joinEl.addEventListener(
      "input",
      e=>{
        joinCodeInput=
          e.target.value
            .toUpperCase()
            .replace(/[^A-Z0-9]/g,"")
            .slice(0,5);
      }
    );
  }

  const createBtn=
    document.getElementById(
      "createBtn"
    );

  if(createBtn){
    createBtn.addEventListener(
      "click",
      createRoom
    );
  }

  const joinBtn=
    document.getElementById(
      "joinBtn"
    );

  if(joinBtn){
    joinBtn.addEventListener(
      "click",
      joinRoom
    );
  }

  /*
    Lobby
  */

  const rulesBtn=
    document.getElementById(
      "rulesBtn"
    );

  if(rulesBtn){

    rulesBtn.addEventListener(
      "click",
      ()=>{
        screen="rules";
        render();
      }
    );
  }

  const startBtn=
    document.getElementById(
      "startBtn"
    );

  if(startBtn){

    startBtn.addEventListener(
      "click",
      startGame
    );
  }

  const editNameBtn=
    document.getElementById(
      "editNameBtn"
    );

  if(editNameBtn){

    editNameBtn.addEventListener(
      "click",
      ()=>{
        nameInput=
          me.name||"";
        screen="editname";
        render();
      }
    );
  }

  /*
    Home/exit
  */

  const homeBtn=
    document.getElementById(
      "homeBtn"
    );

  if(homeBtn){

    homeBtn.addEventListener(
      "click",
      leaveToHome
    );
  }

  /*
    Rules
  */

  const saveRulesBtn=
    document.getElementById(
      "saveRulesBtn"
    );

  if(saveRulesBtn){

    saveRulesBtn.addEventListener(
      "click",
      saveRules
    );
  }

  const cancelRulesBtn=
    document.getElementById(
      "cancelRulesBtn"
    );

  if(cancelRulesBtn){

    cancelRulesBtn.addEventListener(
      "click",
      ()=>{
        screen="lobby";
        render();
      }
    );
  }

  /*
    Edit name
  */

  const editNameInput=
    document.getElementById(
      "editNameInput"
    );

  if(editNameInput){

    editNameInput.addEventListener(
      "input",
      e=>{
        nameInput=e.target.value;
      }
    );
  }

  const saveNameBtn=
    document.getElementById(
      "saveNameBtn"
    );

  if(saveNameBtn){

    saveNameBtn.addEventListener(
      "click",
      saveName
    );
  }

  const cancelNameBtn=
    document.getElementById(
      "cancelNameBtn"
    );

  if(cancelNameBtn){

    cancelNameBtn.addEventListener(
      "click",
      ()=>{
        screen="lobby";
        render();
      }
    );
  }

  /*
    Game
  */

  const playBtn=
    document.getElementById(
      "playBtn"
    );

  if(playBtn){

    playBtn.addEventListener(
      "click",
      doPlay
    );
  }

  const passBtn=
    document.getElementById(
      "passBtn"
    );

  if(passBtn){

    passBtn.addEventListener(
      "click",
      doPass
    );
  }

  /*
    Pending
  */

  const resolveBtn=
    document.getElementById(
      "resolvePendingBtn"
    );

  if(resolveBtn){

    resolveBtn.addEventListener(
      "click",
      doResolvePendingAction
    );
  }

  const bombButtons=
    document.querySelectorAll(
      "[data-bomb-rank]"
    );

  bombButtons.forEach(btn=>{

    btn.addEventListener(
      "click",
      ()=>{

        const raw=
          btn.dataset.bombRank;

        pendingBombRank=
          raw==="joker"
            ? "joker"
            : Number(raw);

        render();
      }
    );
  });

  /*
    Result
  */

  const backLobbyBtn=
    document.getElementById(
      "backLobbyBtn"
    );

  if(backLobbyBtn){

    backLobbyBtn.addEventListener(
      "click",
      ()=>{
        screen="lobby";
        render();
      }
    );
  }
}

/* =========================================================
   Leave
========================================================= */

async function leaveToHome(){

  if(!currentRoomCode){

    screen="home";
    render();
    return;
  }

  try{

    const st=
      await getShared(
        roomPath(currentRoomCode)
      );

    if(st){

      const index=
        st.players.findIndex(
          p=>p.id===me.id
        );

      if(index>=0){

        st.players.splice(
          index,
          1
        );

        pushLog(
          st,
          me.name+
          " が退出しました"
        );

        /*
          ホストが抜けた場合、
          残っている人へホストを移す
        */
        if(
          st.hostId===me.id
        ){

          if(st.players.length){

            st.hostId=
              st.players[0].id;

            pushLog(
              st,
              nameOf(
                st,
                st.hostId
              )+
              " が新しいホストになりました"
            );

          }else{

            /*
              全員いなくなったら
              部屋データ削除
            */
            await window.fbdb
              .ref(
                roomPath(
                  currentRoomCode
                )
              )
              .remove();

            finishLeave();
            return;
          }
        }

        /*
          ゲーム中に抜ける場合は
          今回は簡易的に部屋から削除。
        */
        if(
          st.turnPlayerId===me.id
        ){

          if(
            st.players.length>0
          ){

            st.turnPlayerId=
              st.players[0].id;
          }
        }

        await setShared(
          roomPath(currentRoomCode),
          st
        );
      }
    }

  }catch(e){

    console.error(e);

  }finally{

    finishLeave();
  }
}

function finishLeave(){

  if(unwatch){
    unwatch();
    unwatch=null;
  }

  currentRoomCode=null;
  room=null;

  selected.clear();
  pendingSelected.clear();
  pendingBombRank=null;

  screen="home";

  render();
}

/* =========================================================
   Initial
========================================================= */

loadLocal();

if(me.name){
  nameInput=me.name;
}

screen="home";

render();

    showDebug(
      "Firebaseを読み込めませんでした。"+
      "インターネット接続とFirebase設定を確認してください。"
    );

  }

},1000);

})();
